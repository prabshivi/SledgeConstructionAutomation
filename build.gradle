plugins {
    id 'java'
}

group = 'com.saucedemo'
version = '1.0.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}


dependencies {
    implementation 'com.microsoft.playwright:playwright:1.58.0'

    testImplementation 'io.cucumber:cucumber-java:8.1.0'
    testImplementation 'io.cucumber:cucumber-junit-platform-engine:8.1.0'
    testImplementation 'io.cucumber:cucumber-picocontainer:8.1.0'
    testImplementation 'com.fasterxml.jackson.core:jackson-databind:2.17.2'
    testImplementation 'com.fasterxml.jackson.datatype:jackson-datatype-jdk8:2.17.2'
    testImplementation 'org.junit.platform:junit-platform-suite:1.11.4'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.11.4'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// ---- test: forwards -Dbrowser, -Dheadless, -Dcucumber.filter.tags ----
tasks.named('test', Test) {
    useJUnitPlatform()
    outputs.upToDateWhen { false }
    testLogging {
        events 'passed', 'failed', 'skipped'
        showStandardStreams = true
    }
    ['browser', 'headless', 'cucumber.filter.tags'].each { key ->
        def v = System.getProperty(key)
        if (v != null) systemProperty key, v
    }
}

// ---- Install Playwright browsers (no Node needed) ----
tasks.register('playwrightInstall', JavaExec) {
    group = 'playwright'
    description = 'Installs Playwright browser binaries'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.microsoft.playwright.CLI'
    args = ['install']
}

// ---- Open Playwright Trace Viewer ----
// Usage: ./gradlew showTrace [-PtraceFile=path/to/trace.zip]
tasks.register('showTrace', JavaExec) {
    group = 'playwright'
    description = 'Opens the Playwright Trace Viewer for the generated trace.zip'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.microsoft.playwright.CLI'
    def traceFile = providers.gradleProperty('traceFile')
            .orElse(layout.buildDirectory.file('reports/playwright/traces/latest-trace.zip').map { it.asFile.absolutePath })
    argumentProviders.add({ ['show-trace', traceFile.get()] } as CommandLineArgumentProvider)
}

// ---- Reproduce BUG-001 and save screenshots to docs/bug-reports/BUG-001 ----
tasks.register('captureBug001', JavaExec) {
    group = 'verification'
    description = 'Reproduces BUG-001 (cart shared across users) and captures screenshots'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.saucedemo.evidence.Bug001Evidence'
}
